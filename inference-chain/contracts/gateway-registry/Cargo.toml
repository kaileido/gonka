[package]
name = "gateway-registry"
version = "0.1.0"
authors = ["Inference Team"]
edition = "2021"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-schema = "3.0.1"
cosmwasm-std = "3.0.1"
cw-storage-plus = "3.0.0"
cw2 = "3.0.0"
schemars = "0.8.12"
serde = { version = "1.0.184", default-features = false, features = ["derive"] }
thiserror = "1.0.44"

[dev-dependencies]
cw-multi-test = "3.0.1"
